[env:hwt_valve]
custom_meshtastic_hw_model = 48
custom_meshtastic_hw_model_slug = HELTEC_WIRELESS_TRACKER
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Heltec Wireless Tracker V1.1 (Valve Actuator)
custom_meshtastic_images = heltec-wireless-tracker.svg
custom_meshtastic_tags = Heltec
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 8MB

extends = esp32s3_base
board = heltec_wireless_tracker
board_build.partitions = default_8MB.csv
upload_protocol = esptool

build_unflags =
  ${esp32s3_base.build_unflags}
  -flto

build_flags =
  ${esp32s3_base.build_flags}
  -fno-lto
  -I variants/esp32s3/heltec_wireless_tracker
  -D HELTEC_TRACKER_V1_1
  -D IRRIGATION_MODULE_ENABLE=1
  -D IRRIGATION_PROFILE_VALVE_ACTUATOR=1
  -D IRRIGATION_FARM_ID=\"farm_01\"
  -D IRRIGATION_LINE_ID=\"infrastructure\"
  -D IRRIGATION_ENDPOINT_ROLE=\"VALVE\"
  -D IRRIGATION_HEARTBEAT_INTERVAL_SEC=300
  ; GPIO4 drives only a protected MOSFET/driver input, never the solenoid directly.
  -D IRRIGATION_VALVE_CONTROL_PIN=4
  -D IRRIGATION_VALVE_ACTIVE_HIGH=1
  -D IRRIGATION_VALVE_MAX_OPEN_SEC=3600
  -D MESHTASTIC_EXCLUDE_WIFI=1
  -D MESHTASTIC_EXCLUDE_BLUETOOTH=1
  -D MESHTASTIC_EXCLUDE_SCREEN=1

